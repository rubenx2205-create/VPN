name: CompartirVPN APK

on:
  push:
    paths: ["CompartirVPN/**", ".github/workflows/compartirvpn.yml"]
  pull_request:
    paths: ["CompartirVPN/**", ".github/workflows/compartirvpn.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CompartirVPN
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Pruebas y compilación
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: CompartirVPN-debug-apk
          path: CompartirVPN/app/build/outputs/apk/debug/app-debug.apk
